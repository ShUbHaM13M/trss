name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: trss
          - os: windows-latest
            platform: windows-x86_64
            binary: trss.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      # Linux archive
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/trss
          cp target/release/trss dist/trss/
          cp README.md dist/trss/
          if [ -f LICENSE ]; then
            cp LICENSE dist/trss/
          fi

          tar -czf dist/trss-${{ matrix.platform }}.tar.gz \
            -C dist trss

      # Windows archive
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/trss | Out-Null

          Copy-Item target/release/trss.exe dist/trss/
          Copy-Item README.md dist/trss/

          if (Test-Path LICENSE) {
            Copy-Item LICENSE dist/trss/
          }

          Compress-Archive `
            -Path dist/trss/* `
            -DestinationPath dist/trss-${{ matrix.platform }}.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: trss-${{ matrix.platform }}
          path: dist/trss-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v4
        with:
          files: dist/*
          generate_release_notes: true